name: v5.0 ecological foresight audit

on:
  push:
    branches: [main]
    paths:
      - 'src/latent_worlds/forecast_value.py'
      - 'tests/test_forecast_value.py'
      - 'examples/benchmark_v50_forecast_value.py'
      - 'docs/EXPERIMENT_v5.0.md'
      - '.github/workflows/v5.0-forecast-value.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast-value:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_forecast_value.py tests/test_predictive_ecology.py tests/test_recurrent_null_controls.py tests/test_world.py
      - name: Ecological foresight audit
        run: PYTHONPATH=src python examples/benchmark_v50_forecast_value.py > docs/EXPERIMENT_v5.0_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v5.0_RESULTS.json
          git commit -m 'Record v5.0 ecological foresight audit' || exit 0
          git pull --rebase origin main
          git push
