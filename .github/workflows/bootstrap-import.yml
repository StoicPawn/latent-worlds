name: Import Latent Worlds v3.7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'ac4c98f1c493d28f59451b471b8241c730bb98ff76449b922131e7027f94c2e6  .bootstrap/archive.zip' | sha256sum -c -
          unzip -tq .bootstrap/archive.zip

      - name: Replace bootstrap with project source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lw-extract
          mkdir -p /tmp/lw-extract
          unzip -q .bootstrap/archive.zip -d /tmp/lw-extract
          test "$(find /tmp/lw-extract/latent-worlds-v3.7 -type f | wc -l)" -eq 108
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lw-extract/latent-worlds-v3.7/. .

      - name: Commit complete v3.7 project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete Latent Worlds v3.7'
          git push origin HEAD:main
