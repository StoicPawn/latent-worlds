name: v4.0 population contingency

on:
  push:
    branches: [main]
    paths:
      - 'docs/EXPERIMENT_v3.9_RESULTS.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  population-contingency:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Targeted regression tests
        run: pytest -q tests/test_causal_transmission.py tests/test_replication.py tests/test_transition_conditions.py tests/test_world.py
      - name: Population contingency campaign
        run: PYTHONPATH=src python examples/benchmark_population_contingency.py > docs/EXPERIMENT_v4.0_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v4.0_RESULTS.json
          git commit -m 'Record v4.0 population contingency results' || exit 0
          git push
