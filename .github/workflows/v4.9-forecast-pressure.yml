name: v4.9 forecast pressure factorial

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_predictive_ecology.py tests/test_recurrent_null_controls.py tests/test_epistemic_carriers.py tests/test_epistemic_decoder_controls.py tests/test_epistemic_convergence.py tests/test_world.py
      - name: Prospective forecast-pressure factorial
        run: PYTHONPATH=src python examples/benchmark_v49_forecast_pressure.py > docs/EXPERIMENT_v4.9_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v4.9_RESULTS.json
          git commit -m 'Record v4.9 forecast-pressure results' || exit 0
          git pull --rebase origin main
          git push
