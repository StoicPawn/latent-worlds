name: v3.8 trajectory prediction

on:
  push:
    branches: [main]
    paths:
      - 'src/latent_worlds/trajectory_transition.py'
      - 'tests/test_trajectory_transition.py'
      - 'examples/benchmark_trajectory_prediction.py'
      - '.github/workflows/v3.8-trajectory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Targeted tests
        run: pytest -q tests/test_trajectory_transition.py tests/test_pretransition_prediction.py tests/test_causal_transmission.py tests/test_replication.py
      - name: Prospective trajectory campaign
        run: PYTHONPATH=src python examples/benchmark_trajectory_prediction.py | tee docs/EXPERIMENT_v3.8_RESULTS.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3.8-trajectory-result
          path: docs/EXPERIMENT_v3.8_RESULTS.json
      - name: Commit preregistered result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EXPERIMENT_v3.8_RESULTS.json
          git diff --cached --quiet || git commit -m "Record v3.8 prospective trajectory results"
          git push
