name: v5.1 recurrent context access

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  context-access:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_recurrent_context.py tests/test_predictive_ecology.py tests/test_recurrent_null_controls.py tests/test_epistemic_carriers.py tests/test_epistemic_decoder_controls.py tests/test_epistemic_convergence.py tests/test_world.py
      - name: Prospective context-access factorial
        run: PYTHONPATH=src python examples/benchmark_v51_context_access.py > docs/EXPERIMENT_v5.1_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v5.1_RESULTS.json
          git commit -m 'Record v5.1 recurrent context-access results' || exit 0
          git pull --rebase origin main
          git push
