name: v4.8 frozen recurrent reservoir control

on:
  push:
    branches: [main]
    paths:
      - 'src/latent_worlds/config.py'
      - 'src/latent_worlds/world.py'
      - 'tests/test_recurrent_null_controls.py'
      - 'examples/benchmark_v48_recurrent_null.py'
      - 'docs/EXPERIMENT_v4.8.md'
      - '.github/workflows/v4.8-recurrent-null.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recurrent-null:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_recurrent_null_controls.py tests/test_epistemic_carriers.py tests/test_epistemic_decoder_controls.py tests/test_epistemic_convergence.py tests/test_world.py
      - name: Prospective full-vs-frozen recurrent control
        run: PYTHONPATH=src python examples/benchmark_v48_recurrent_null.py > docs/EXPERIMENT_v4.8_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v4.8_RESULTS.json
          git commit -m 'Record v4.8 recurrent reservoir control results' || exit 0
          git pull --rebase origin main
          git push
