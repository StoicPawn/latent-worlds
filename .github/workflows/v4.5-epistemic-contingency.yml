name: v4.5 epistemic contingency diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'src/latent_worlds/epistemic_convergence.py'
      - 'tests/test_epistemic_convergence.py'
      - 'examples/benchmark_epistemic_contingency.py'
      - 'docs/EXPERIMENT_v4.5.md'
      - '.github/workflows/v4.5-epistemic-contingency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epistemic-contingency:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_epistemic_convergence.py tests/test_epistemic_transition.py tests/test_world.py
      - name: Prospective same-physics diagnostic
        run: PYTHONPATH=src python examples/benchmark_epistemic_contingency.py > docs/EXPERIMENT_v4.5_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v4.5_RESULTS.json
          git commit -m 'Record v4.5 epistemic contingency results' || exit 0
          git push
