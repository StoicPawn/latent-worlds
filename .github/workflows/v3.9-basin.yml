name: v3.9 causal basin map

on:
  push:
    branches: [main]
    paths:
      - 'examples/benchmark_basin_map.py'
      - '.github/workflows/v3.9-basin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  basin:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Targeted regression tests
        run: pytest -q tests/test_causal_transmission.py tests/test_replication.py tests/test_transition_conditions.py tests/test_world.py
      - name: Matched W11 basin map
        run: PYTHONPATH=src python examples/benchmark_basin_map.py > docs/EXPERIMENT_v3.9_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v3.9_RESULTS.json
          git commit -m 'Record v3.9 causal basin map results' || exit 0
          git push
