name: v4.3 prospective full mechanism

on:
  push:
    branches: [main]
    paths:
      - 'examples/benchmark_v43_full_mechanism.py'
      - 'docs/EXPERIMENT_v4.3.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_causal_transmission.py tests/test_replication.py tests/test_adaptive_search.py tests/test_adaptive_persistence.py tests/test_world.py
      - name: Prospective full-mechanism follow-up
        run: PYTHONPATH=src python examples/benchmark_v43_full_mechanism.py > docs/EXPERIMENT_v4.3_RESULTS.json
      - name: Persist result in Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EXPERIMENT_v4.3_RESULTS.json
          git commit -m 'Record v4.3 prospective full-mechanism results' || exit 0
          git push
